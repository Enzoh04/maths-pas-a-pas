site_name: Maths Pas à Pas
site_url: https://enzoh04.github.io/maths-pas-a-pas/
site_description: Cours, méthodes, exercices corrigés et annales de mathématiques, de la Seconde au Master.
docs_dir: docs
copyright: "Contenu produit avec l'aide d'une intelligence artificielle : il peut contenir des erreurs. Voir la page Avertissement."
use_directory_urls: false

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  icon:
    logo: material/sigma

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex/katex.min.js
  - javascripts/katex/auto-render.min.js
  - javascripts/katex-init.js

extra_css:
  - javascripts/katex/katex.min.css
  - stylesheets/extra.css

nav:
  - Accueil: index.md
  - Avertissement: avertissement.md
  - Programmes officiels:
      - programmes/index.md
      - Seconde: programmes/seconde.md
      - Première: programmes/premiere.md
      - Terminale: programmes/terminale.md
  - Première:
      - premiere/index.md
      - "Ch. 1 – Suites numériques":
          - premiere/suites/index.md
          - Cours: premiere/suites/cours.md
          - Méthodes: premiere/suites/methodes.md
          - Exercices corrigés: premiere/suites/exercices.md
          - Sujets type épreuve anticipée: premiere/suites/bac.md
      - "Ch. 2 – Second degré":
          - premiere/second-degre/index.md
          - Cours: premiere/second-degre/cours.md
          - Méthodes: premiere/second-degre/methodes.md
